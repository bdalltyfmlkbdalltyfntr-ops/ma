<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة - Calculator</title>
    <link rel="stylesheet" href="style2.css">
</head>
<body>

    <!-- زرار التبديل بين الدارك والمود العادي -->
    <div class="mode-toggle">
        <span id="mode-text">NORMAL MODE</span>
        <button id="theme-btn" onclick="toggleTheme()"></button>
    </div>

    <div class="calculator">
        <!-- شاشة العرض -->
        <input type="text" id="display" class="display" readonly value="0">

        <!-- الأزرار -->
        <div class="buttons">
            <button class="btn btn-red" onclick="clearScreen()">C</button>
            <button class="btn" onclick="appendValue('%')">%</button>
            <button class="btn" onclick="appendValue('/')">÷</button>
            <button class="btn btn-op" onclick="appendValue('*')">×</button>

            <button class="btn" onclick="appendValue('7')">7</button>
            <button class="btn" onclick="appendValue('8')">8</button>
            <button class="btn" onclick="appendValue('9')">9</button>
            <button class="btn btn-op" onclick="appendValue('-')">-</button>

            <button class="btn" onclick="appendValue('4')">4</button>
            <button class="btn" onclick="appendValue('5')">5</button>
            <button class="btn" onclick="appendValue('6')">6</button>
            <button class="btn btn-op" onclick="appendValue('+')">+</button>

            <button class="btn" onclick="appendValue('1')">1</button>
            <button class="btn" onclick="appendValue('2')">2</button>
            <button class="btn" onclick="appendValue('3')">3</button>

            <button class="btn btn-zero" onclick="appendValue('0')">0</button>
            <button class="btn" onclick="appendValue('.')">.</button>
            <button class="btn btn-equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script src="./main2.js"></script>
</body>
</html>
